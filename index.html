<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Solo Europe 41 | 歐洲獨旅攻略：41 國行程景點、交通、住宿深度懶人包</title>
    
    <meta name="description" content="由獨旅達人 Bryan 分享的 41 國歐洲獨旅真實經驗。提供義大利錫耶納、佛羅倫斯、法國巴黎等熱門城市最直覺的交通指南、安全住宿推薦與旅行省錢連結，幫你完成夢想中的歐洲自由行。">
    
    <meta name="keywords" content="歐洲獨旅, 歐洲自由行攻略, 義大利旅遊, 錫耶納攻略, 歐洲交通指南, 歐洲省錢旅遊, 獨自旅行建議">
    
    <meta property="og:title" content="Solo Europe 41 | 歐洲獨旅攻略：41 國深度生活紀錄">
    <meta property="og:description" content="不走馬看花。提供最真實的交通指南、安全住宿與省錢連結。">
    <meta property="og:image" content="images/italy/siena/siena_main.jpg">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <style>
        html { scroll-behavior: smooth; }
        .leaflet-container { background: #f8fafc; z-index: 10; }
        .leaflet-tile-container { filter: grayscale(20%) brightness(105%); }
    </style>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Solo Europe 41",
      "alternateName": "歐洲獨旅攻略 41 國",
      "url": "https://你的網址.com/",
      "author": {
        "@type": "Person",
        "name": "Bryan"
      },
      "description": "提供 41 個歐洲國家的獨旅經驗與深度攻略。"
    }
    </script>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav id="main-nav" class="fixed top-0 left-0 w-full p-6 bg-white shadow-sm flex justify-between items-center z-[1000] transition-transform duration-300 ease-in-out">
        <div class="text-xl font-bold tracking-tighter">SOLO<span class="text-blue-600">EUROPE</span></div>
        <div class="space-x-6 text-sm font-medium">
            <a href="#city-grid" class="hover:text-blue-600 text-gray-600">所有城市攻略</a>
            <a href="#" class="hover:text-blue-600 text-gray-600">獨旅推薦裝備</a>
            <a href="#" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">關於獨旅者 Bryan</a>
        </div>
    </nav>

    <div class="h-20"></div>

    <header class="py-16 px-6 text-center bg-white border-b border-gray-100">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 text-gray-900">歐洲 41 國獨旅攻略：真實交通、住宿與私房景點經驗分享</h1>
        <p class="text-gray-500 text-lg max-w-2xl mx-auto">拒絕走馬看花。這是我獨自走過 41 個國家後，為你整理的最精準自由行指南。</p>
    </header>

    <section class="max-w-5xl mx-auto px-6 py-12">
        
        <div class="flex justify-between items-end mb-4">
            <h2 class="text-2xl font-bold border-l-4 border-blue-600 pl-4" id="list-title">🗺️ 歐洲獨旅地圖：探索各國攻略</h2>
            <button id="reset-btn" class="hidden text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg transition font-bold">
                ✕ 顯示所有城市
            </button>
        </div>

        <div id="map" class="w-full h-[450px] rounded-2xl shadow-sm border border-gray-100 mb-12 relative"></div>
        
        <div id="city-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8 scroll-mt-24">
            </div>

    </section>

    <footer class="text-center py-12 text-gray-400 border-t bg-white text-sm">
        <p>&copy; 2026 Solo Europe Guide. 專業歐洲獨旅經驗紀錄。Built with Passion.</p>
    </footer>

    <script>
        const cityData = [
            {
                id: 'siena',
                country: '🇮🇹 義大利 Italy',
                city: 'Siena 錫耶納',
                subtitle: '迷失在中世紀紅磚之城',
                lat: 43.3188,
                lng: 11.3308,
                img: 'images/italy/siena/siena_main.jpg',
                desc: '錫耶納獨旅攻略：比起佛羅倫斯的擁擠，這裡更適合一個人靜靜享受托斯卡尼陽光。整理必訪田野廣場與大教堂心得。',
                link: 'siena.html'
            },
            {
                id: 'florence',
                country: '🇮🇹 義大利 Italy',
                city: 'Florence 佛羅倫斯',
                subtitle: '文藝復興的浪漫搖籃',
                lat: 43.7695,
                lng: 11.2558,
                img: 'images/italy/siena/siena_main.jpg',
                desc: '佛羅倫斯獨旅日記：漫步在聖母百花大教堂旁，感受中世紀藝術的極致巔峰，適合自由行慢旅。',
                link: '#'
            },
            {
                id: 'paris',
                country: '🇫🇷 法國 France',
                city: 'Paris 巴黎',
                subtitle: '浪漫與混亂的交織',
                lat: 48.8566,
                lng: 2.3522,
                img: 'images/italy/siena/siena_main.jpg',
                desc: '獨旅巴黎全攻略：分享安全守則與避開扒手技巧，教你如何像巴黎人一樣優雅地喝咖啡。',
                link: '#'
            }
        ];

        const cityGrid = document.getElementById('city-grid');
        const resetBtn = document.getElementById('reset-btn');
        const listTitle = document.getElementById('list-title');

        function renderCards(data) {
            cityGrid.innerHTML = '';
            
            if (data.length === 0) {
                cityGrid.innerHTML = '<p class="text-gray-500 col-span-3 text-center py-10">找不到符合的城市。</p>';
                return;
            }

            data.forEach(item => {
                // 7. 圖片加上 alt 標籤，這對 Google 圖片搜尋極度重要
                const cardHTML = `
                    <a href="${item.link}" class="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all border border-gray-100 flex flex-col h-full">
                        <div class="h-48 bg-gray-200 overflow-hidden relative">
                            <img src="${item.img}" alt="${item.city} 獨旅自由行攻略" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <span class="text-blue-600 text-xs font-bold uppercase tracking-wider">${item.country}</span>
                            <h3 class="text-xl font-bold mt-2 text-gray-800">${item.city}</h3>
                            <p class="text-sm text-gray-500 mt-1 mb-3">${item.subtitle}</p>
                            <p class="text-gray-600 text-sm line-clamp-3 mt-auto pt-4 border-t border-gray-50">${item.desc}</p>
                        </div>
                    </a>
                `;
                cityGrid.innerHTML += cardHTML;
            });
        }

        renderCards(cityData);

        const map = L.map('map').setView([48.0, 10.0], 5);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OSM & CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const markers = L.markerClusterGroup({
            showCoverageOnHover: false,
            maxClusterRadius: 80
        });

        cityData.forEach(item => {
            const marker = L.marker([item.lat, item.lng]);
            marker.bindPopup(`<b>${item.city}</b><br><a href="${item.link}" class="text-blue-600 text-xs hover:underline">閱讀攻略 →</a>`);
            marker.options.cityId = item.id;
            marker.options.country = item.country;

            marker.on('click', function(e) {
                const filteredData = cityData.filter(d => d.id === e.target.options.cityId);
                renderCards(filteredData);
                listTitle.innerText = `📍 ${item.city}`;
                resetBtn.classList.remove('hidden');
            });

            markers.addLayer(marker);
        });

        map.addLayer(markers);

        markers.on('clusterclick', function (a) {
            const childMarkers = a.layer.getAllChildMarkers();
            const countriesInCluster = new Set();
            childMarkers.forEach(m => countriesInCluster.add(m.options.country));
            const filteredData = cityData.filter(d => countriesInCluster.has(d.country));
            renderCards(filteredData);
            const countryArray = Array.from(countriesInCluster);
            if (countryArray.length === 1) {
                listTitle.innerText = `📍 ${countryArray[0]}`;
            } else {
                listTitle.innerText = `🇪🇺 歐洲熱門區域`;
            }
            resetBtn.classList.remove('hidden');
        });

        function resetView() {
            renderCards(cityData);
            map.setView([48.0, 10.0], 5);
            listTitle.innerText = `🗺️ 歐洲獨旅地圖：探索各國攻略`;
            resetBtn.classList.add('hidden');
        }

        map.on('click', resetView);
        resetBtn.addEventListener('click', resetView);

        let lastScrollTop = 0;
        const mainNav = document.getElementById('main-nav');
        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                mainNav.style.transform = 'translateY(-100%)';
            } else {
                mainNav.style.transform = 'translateY(0)';
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }, false);
    </script>
</body>
</html>
